    .table-wrap {

    function esc(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // 1. 학교별 승무패 순위 계산 (승3·무1·패0 → 골득실 → 다득점)
    function computeStandings(matches) {
      const map = {};
      const getSchoolRow = (name) => {
        const s = String(name || '').trim();
        if (!s) return null;
        if (!map[s]) {
          map[s] = { school: s, gp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 };
        }
        return map[s];
      };

      matches.forEach(m => {
        const homeName = m.home?.school || m.homeSchool;
        const awayName = m.away?.school || m.awaySchool;
        const hs = Number(m.home?.score ?? m.homeScore);
        const as = Number(m.away?.score ?? m.awayScore);
        if (!homeName || !awayName || isNaN(hs) || isNaN(as)) return;

        const h = getSchoolRow(homeName);
        const a = getSchoolRow(awayName);
        h.gp += 1;
        a.gp += 1;
        h.gf += hs;
        h.ga += as;
        a.gf += as;
        a.ga += hs;

        if (hs > as) {
          h.w += 1;
          h.pts += 3;
          a.l += 1;
        } else if (hs < as) {
          a.w += 1;
          a.pts += 3;
          h.l += 1;
        } else {
          h.d += 1;
          a.d += 1;
          h.pts += 1;
          a.pts += 1;
        }
      });

      const list = Object.values(map).map(r => ({ ...r, gd: r.gf - r.ga }));
      list.sort((x, y) => {
        if (y.pts !== x.pts) return y.pts - x.pts;
        if (y.gd !== x.gd) return y.gd - x.gd;
        if (y.gf !== x.gf) return y.gf - x.gf;
        return x.school.localeCompare(y.school, 'ko');
      });
      return list.map((r, i) => ({ ...r, rank: i + 1 }));
    }

    // 2. 개인 포인트(G+A) 순위 및 학교별 선수 명단 계산 (이름, 등번호, 학교, 경기 기록만 사용)
    function computePlayersAndRosters(matches) {
      const playerMap = {};
      const schoolRosters = {};

      matches.forEach(m => {
        ['home', 'away'].forEach(side => {
          const teamObj = m[side] || {};
          const schoolName = String(teamObj.school || m[`${side}School`] || '').trim();
          if (!schoolName) return;
          if (!schoolRosters[schoolName]) schoolRosters[schoolName] = {};

          const players = Array.isArray(teamObj.players) ? teamObj.players : [];
          players.forEach(p => {
            const number = String(p.number ?? '').trim();
            const name = String(p.name ?? '').trim();
            const goals = Number(p.goals) || 0;
            const assists = Number(p.assists) || 0;
            const penalties = Number(p.penalties ?? p.penaltyCount) || 0;
            if (!number && !name && goals === 0 && assists === 0 && penalties === 0) return;

            const key = `${schoolName}__${number}__${name}`;
            if (!playerMap[key]) {
              playerMap[key] = {
                school: schoolName,
                number: number || '-',
                name: name || '-',
                gp: 0,
                goals: 0,
                assists: 0,
                points: 0,
                penalties: 0
              };
            }
            const item = playerMap[key];
            item.gp += 1;
            item.goals += goals;
            item.assists += assists;
            item.points += (goals + assists);
            item.penalties += penalties;

            schoolRosters[schoolName][key] = item;
          });
        });
      });

      const playerList = Object.values(playerMap).filter(p => p.points > 0 || p.penalties > 0);
      playerList.sort((x, y) => {
        if (y.points !== x.points) return y.points - x.points;
        if (y.goals !== x.goals) return y.goals - x.goals;
        if (y.assists !== x.assists) return y.assists - x.assists;
        return x.name.localeCompare(y.name, 'ko');
      });

      return {
        rankedPlayers: playerList.map((p, i) => ({ ...p, rank: i + 1 })),
        schoolRosters
      };
    }

      const maEl = document.getElementById('matchesContainer');
      if (matches.length === 0) {
        maEl.innerHTML = '<div style="padding:18px;text-align:center;color:#94a3b8;">등록된 경기 결과가 없습니다.</div>';
      } else {
        maEl.innerHTML = `
          <table>
            <thead>

              ${matches.map((m, idx) => {

                const as = Number(m.away?.score ?? m.awayScore) || 0;
                const playedTime = m.playedAt ? String(m.playedAt).replace('T', ' ').slice(0, 16) : '-';
                const summary = [];
                ['home', 'away'].forEach(side => {
                  const sName = m[side]?.school || m[`${side}School`] || '';
                  (m[side]?.players || []).forEach(p => {

                    }
                  });
                });
                return `

      const roEl = document.getElementById('rostersContainer');

      if (schoolNames.length === 0) {
        roEl.innerHTML = '<div style="padding:18px;color:#94a3b8;">등록된 선수 명단이 없습니다.</div>';
      } else {
        roEl.innerHTML = schoolNames.map(sName => {
          const pList = Object.values(schoolRosters[sName]).sort((a, b) => (parseInt(a.number, 10) || 999) - (parseInt(b.number, 10) || 999));
          return `

    let cachedMatches = [];
    let lastUpdatedAtCursor = null;

    function resolveReadEndpoint() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('sample') === '1') return './sample_matches.json';

      const raw = String(window.FLOORBALL_READ_URL || window.FLOORBALL_API_BASE_URL || '').trim();
      if (!raw) return './sample_matches.json';

      const clean = raw.replace(/\/+$/, '');
      return clean.endsWith('/matches') ? clean : `${clean}/matches`;
    }

    function mergeMatches(existingList, incomingList) {
      const map = new Map();
      existingList.forEach(m => {
        if (m && m.matchId) map.set(m.matchId, m);
      });
      incomingList.forEach(m => {
        if (m && m.matchId) map.set(m.matchId, m);
      });
      return Array.from(map.values());
    }

    async function loadMatches() {
      const baseEndpoint = resolveReadEndpoint();
      const isSampleMode = baseEndpoint === './sample_matches.json';
      const nowStr = new Date().toLocaleTimeString('ko-KR', { hour12: false });

      let requestUrl = baseEndpoint;
      if (!isSampleMode) {
        const pageParams = new URLSearchParams(window.location.search);
        const query = new URLSearchParams();
        const tid = pageParams.get('tournamentId');
        if (tid) query.set('tournamentId', tid);
        if (lastUpdatedAtCursor) query.set('since', lastUpdatedAtCursor);
        const qs = query.toString();
        if (qs) requestUrl += (requestUrl.includes('?') ? '&' : '?') + qs;
      }

      try {
        const res = await fetch(requestUrl, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const incoming = Array.isArray(data) ? data : (Array.isArray(data?.matches) ? data.matches : []);

        if (isSampleMode || !lastUpdatedAtCursor) {
          cachedMatches = incoming;
        } else if (incoming.length > 0) {
          cachedMatches = mergeMatches(cachedMatches, incoming);
        }

        if (data && typeof data.lastUpdatedAt === 'string' && data.lastUpdatedAt) {
          lastUpdatedAtCursor = data.lastUpdatedAt;
        }

        renderPortal(
          cachedMatches,
          `최근 조회: ${nowStr}${data?.lastUpdatedAt ? ` (서버 갱신: ${data.lastUpdatedAt})` : ''}`
        );
      } catch (err) {
        if (isSampleMode) {
          renderPortal(FALLBACK_SAMPLE_MATCHES, `최근 조회: ${nowStr} (sample_matches.json 로컬 샘플 3경기)`);
        } else {
          document.getElementById('dataSourceStatus').textContent = `데이터 조회 실패 (${nowStr}) - ${err.message}`;
        }
      }
    }

    // 60초 주기 새로고침 & 백그라운드 탭일 때 정지
    let refreshIntervalId = null;

    function startPolling() {
      if (refreshIntervalId) clearInterval(refreshIntervalId);
      refreshIntervalId = setInterval(() => {
        if (!document.hidden) {
          loadMatches();
        }
      }, 60000);
    }

    function stopPolling() {
      if (refreshIntervalId) {
        clearInterval(refreshIntervalId);
        refreshIntervalId = null;
      }
    }

    document.addEventListener('visibilitychange', () => {
      const infoEl = document.getElementById('refreshTimerInfo');
      if (document.hidden) {
        stopPolling();
        if (infoEl) infoEl.textContent = '자동 새로고침 일시정지됨 (백그라운드 탭)';
      } else {
        loadMatches();
        startPolling();
        if (infoEl) infoEl.textContent = '60초 자동 새로고침 (탭 활성 시)';
      }
    });

    loadMatches();
    if (!document.hidden) {
      startPolling();
    }
  </script>
</body>
</html>
